services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
  backend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/collabboard
      JWT_SECRET: local-development-secret
      CLIENT_URL: http://localhost:5173
    command: sh -c "npm install && npm run seed && npm run dev"
    ports: ["5000:5000"]
    depends_on: [mongo]
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      VITE_API_URL: http://localhost:5000/api/v1
      VITE_SOCKET_URL: http://localhost:5000
    command: sh -c "npm install && npm run dev"
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  mongo_data:
